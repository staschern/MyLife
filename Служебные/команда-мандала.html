<title>Мандала команды</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;700;800&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');

  :root{
    --bg:#F5F2EA;
    --surface:#FFFFFF;
    --ink:#221F17;
    --ink-soft:#5C5646;
    --ink-faint:#8D8570;
    --accent:#3D4A3A;
    --accent-ink:#28331F;
    --border:#DFD7BF;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#17150F;
      --surface:#211E16;
      --ink:#F1ECDC;
      --ink-soft:#C3BBA3;
      --ink-faint:#8C8467;
      --accent:#9FBE97;
      --accent-ink:#D3E7CC;
      --border:#3A3423;
    }
  }
  :root[data-theme="dark"]{
    --bg:#17150F;
    --surface:#211E16;
    --ink:#F1ECDC;
    --ink-soft:#C3BBA3;
    --ink-faint:#8C8467;
    --accent:#9FBE97;
    --accent-ink:#D3E7CC;
    --border:#3A3423;
  }

  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:'Public Sans', system-ui, -apple-system, sans-serif;
    display:flex; flex-direction:column; align-items:center;
    height:100vh; overflow:hidden; padding:10px 12px 8px;
  }
  h1,.eyebrow{ font-family:'Bricolage Grotesque', system-ui, sans-serif; }

  header{ text-align:center; flex:none; margin-bottom:2px; }
  .eyebrow{
    display:inline-flex; align-items:center; gap:6px;
    font-size:11px; letter-spacing:.08em; text-transform:uppercase;
    color:var(--accent-ink); font-weight:600;
  }
  .eyebrow::before{ content:"✦"; color:var(--accent); }
  h1{ font-size:clamp(17px,2.4vw,24px); font-weight:800; margin:1px 0; letter-spacing:-.01em; }
  .sub{ color:var(--ink-faint); font-size:11px; margin:0; }

  .stage{
    flex:1; display:flex; align-items:center; justify-content:center;
    min-height:0; width:100%;
  }
  svg.wheel{
    width:min(94vw, 88vh, 900px);
    height:min(94vw, 88vh, 900px);
    display:block;
  }

  .hub-label{ font-family:'Bricolage Grotesque', sans-serif; }

  footer{
    flex:none; font-size:10px; color:var(--ink-faint); margin-top:2px;
    display:flex; gap:14px;
  }
</style>

</header>
